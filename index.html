<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RadyoAI</title>
<meta name="description" content="RadyoAI — MyByYavRu şarkıları kesintisiz çalıyor.">
<meta name="theme-color" content="#08080c">
<meta property="og:title" content="RadyoAI">
<meta property="og:description" content="MyByYavRu şarkıları kesintisiz çalıyor.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a855f7'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c; --panel:#0f0f16; --card:#12121a; --line:rgba(255,255,255,.07);
  --text:#fff; --dim:rgba(255,255,255,.55); --faint:rgba(255,255,255,.32);
  --purple:#a855f7; --mint:#2ee5a6; --pink:#ff69b4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,.track:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.display{font-family:'Space Grotesk',Inter,sans-serif}

#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0e0e14;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--purple);display:grid;place-items:center;font-weight:700;font-size:18px;box-shadow:0 0 18px rgba(168,85,247,.5)}
.brand b{letter-spacing:.18em;font-size:15px}
.live{display:flex;align-items:center;gap:8px;background:#15151d;border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:6px 14px;font-size:11px;font-weight:600;letter-spacing:.1em}
.live i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px rgba(16,185,129,.8);animation:pulse 1.2s ease-in-out infinite}
.live i.off{background:#555;box-shadow:none;animation:none}
.live em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}
.banner{flex:none;text-align:center;padding:9px 12px;font-size:10px;letter-spacing:.16em;font-weight:700;line-height:1.35;background:linear-gradient(90deg,rgba(168,85,247,.16),rgba(168,85,247,.08),rgba(46,229,166,.1));border-bottom:1px solid rgba(168,85,247,.2)}

.player{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:16px;display:flex;gap:16px;align-items:center}
.vinyl{position:relative;flex:none;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#1a1a24 0,#0d0d12 45%,#000 70%);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 30px rgba(0,0,0,.6);display:grid;place-items:center}
.vinyl::before,.vinyl::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.04)}
.vinyl::before{inset:10px}.vinyl::after{inset:26px}
.vinyl .label{width:38px;height:38px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-weight:700;font-size:16px;box-shadow:0 0 15px rgba(168,85,247,.6)}
.vinyl.spin{animation:spin 3.2s linear infinite}
.wrap-vinyl{position:relative;flex:none}
.badge{position:absolute;top:-8px;right:-8px;background:var(--mint);color:#000;font-size:9px;font-weight:700;letter-spacing:.1em;padding:2px 8px;border-radius:99px;box-shadow:0 0 12px rgba(46,229,166,.6);display:none}
.playing .badge{display:block}
.info{flex:1;min-width:0}
.kicker{font-size:10px;letter-spacing:.18em;color:var(--faint);font-weight:600;margin-bottom:4px}
#title{font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:11px;color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:10px}
.bars span{width:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.14);transition:height .11s}
.playing .bars span{background:linear-gradient(to top,var(--purple),var(--mint))}
.playing .bars span:nth-child(even){background:linear-gradient(to top,var(--purple),var(--pink))}

.controls{flex:none;background:var(--panel);padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.seek{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.seek time{width:36px}.seek time:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:9px;background:linear-gradient(90deg,var(--purple) var(--p),rgba(255,255,255,.12) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:9px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:4px;border-radius:9px;background:var(--purple)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 10px rgba(168,85,247,.7)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.btns{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:color .15s,background .15s}
.ib:hover{color:#fff;background:rgba(255,255,255,.06)}
.ib.on{color:var(--mint)}
.ib svg{width:20px;height:20px;fill:currentColor}
.play{width:56px;height:56px;background:#fff;color:#000;box-shadow:0 0 30px rgba(255,255,255,.22)}
.play:hover{background:#fff;color:#000;box-shadow:0 0 42px rgba(255,255,255,.35)}
.play svg{width:24px;height:24px}
.play:active{transform:scale(.96)}
.vol{display:flex;align-items:center;gap:6px;margin-left:8px;color:var(--faint)}
.vol svg{width:16px;height:16px;fill:currentColor}
.vol input{width:80px;flex:none}

.list{flex:1;min-height:0;display:flex;flex-direction:column}
.list h2{flex:none;height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.05);background:rgba(10,10,18,.8)}
.list h2 span{font-weight:500;letter-spacing:0;color:var(--faint)}
.scroll{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
.track{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;transition:background .15s}
.track:hover{background:#171722}
.track.active{border-color:rgba(168,85,247,.45);background:#15101f;box-shadow:0 0 18px rgba(168,85,247,.14)}
.track .n{width:22px;text-align:center;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.track.active .n{color:var(--mint)}
.track .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.err .t{color:var(--faint);text-decoration:line-through}
.track .tag{font-size:10px;color:#f87171}

.chat{display:none}
.chat.show{display:flex;flex-direction:column;min-height:0;flex:1}
.msg{padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;line-height:1.35}
.msg b{font-size:12px;margin-right:6px}.msg small{color:var(--faint);font-size:10px}
.msg p{margin-top:2px;color:rgba(255,255,255,.85);overflow-wrap:anywhere}
.msg.dj{border-color:rgba(168,85,247,.4);background:#15101f}

#gate{position:fixed;inset:0;z-index:50;background:rgba(8,8,12,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#gate.hide{display:none}
#gate .vinyl{margin-bottom:24px;box-shadow:0 0 50px rgba(168,85,247,.25)}
#gate h2{font-size:22px;letter-spacing:.06em;margin-bottom:8px}
#gate p{font-size:13px;color:var(--dim);max-width:290px;line-height:1.55;margin-bottom:24px}
#start{padding:14px 32px;border-radius:99px;background:#fff;color:#000;font-weight:700;letter-spacing:.14em;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 0 30px rgba(255,255,255,.25);transition:transform .1s}
#start:active{transform:scale(.97)}
#start i{border-left:8px solid #000;border-top:5px solid transparent;border-bottom:5px solid transparent}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55;transform:scale(.9)}}
@media (min-width:768px){
  .player,.controls{padding-left:24px;padding-right:24px}
  header{padding:0 24px}.scroll{padding:12px 24px}.list h2{padding:0 24px}
  #title{font-size:24px}.banner{font-size:11px}
}
@media (max-width:380px){.vol{display:none}.vinyl{width:92px;height:92px}.vinyl::after{inset:20px}}
@media (prefers-reduced-motion:reduce){.vinyl.spin,.live i{animation:none}}

#seek:disabled{pointer-events:none;cursor:default}
#seek::-webkit-slider-thumb{opacity:0}
#seek::-moz-range-thumb{opacity:0}
.msg.me{border-color:rgba(46,229,166,.35)}
.msg.me b{color:var(--mint)}
#cf{flex:none;display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
#ci{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:10px 14px;font:inherit;font-size:16px;outline:none}
#cf button{background:var(--purple);color:#fff;font-weight:700;border-radius:99px;padding:0 18px;font-size:14px}
.gdot{width:8px;height:8px;border-radius:50%;background:#2ee56a;box-shadow:0 0 8px #2ee56a;display:inline-block;animation:gp 1.8s ease-in-out infinite}@keyframes gp{50%{opacity:.35}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><div class="logo display">R</div><b class="display">RADYOAI</b></div>
    <div class="live"><i id="dot" class="off"></i><span id="liveTxt">HAZIR</span><em id="n"></em></div>
  </header>
  <div class="banner display">İSTER YALNIZ İSTERSEN SEVDİKLERİN İLE BİRLİKTE AÇ RADYOAI'Yİ İLK SEN DİNLE</div>

  <section class="player" id="player">
    <div class="wrap-vinyl"><div class="vinyl" id="vinyl"><div class="label display">R</div></div><div class="badge">ÇALIYOR</div></div>
    <div class="info">
      <div class="kicker">ŞİMDİ ÇALIYOR · <span id="count">1 / 1</span></div>
      <h1 id="title" class="display">—</h1>
      <p id="sub">RadyoAI</p>
      <div class="bars" id="bars"></div>
    </div>
  </section>

  <section class="controls">
    <div class="seek"><time id="cur">0:00</time><input id="seek" type="range" disabled min="0" max="1000" value="0" aria-label="Şarkıda ilerle"><time id="dur">0:00</time></div>
    <div class="btns">
      <button class="ib play" id="toggle" aria-label="Çal / Duraklat"><svg id="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <div class="vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input id="vol" type="range" min="0" max="100" value="100" aria-label="Ses"></div>
    </div>
  </section>

  <section class="list" id="listWrap">
    <h2 class="display"><span style="color:inherit;font-weight:700;letter-spacing:.16em">CANLI SOHBET</span><span id="active" style="display:inline-flex;align-items:center;gap:6px;letter-spacing:.04em;text-transform:none;color:#7ff0b0"><i class="gdot"></i><b id="actN">0</b> aktif</span></h2>
    <div class="scroll" id="chat"></div>
    <form id="cf" autocomplete="off"><input id="ci" maxlength="200" placeholder="Mesaj yaz…" aria-label="Mesaj"><button type="submit">Gönder</button></form>
  </section>
</div>

<div id="gate">
  <div class="vinyl spin"><div class="label display">R</div></div>
  <h2 class="display">RADYOAI HAZIR</h2>
  <p id="gateTxt">Şarkılar kesintisiz çalacak. Başlamak için dokun.</p>
  <button id="start" class="display"><i></i>DOKUN VE DİNLE</button>
</div>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
/* ============ AYARLAR — burayı düzenle ============ */
const CONFIG = {
  // Şarkıları iki şekilde ekleyebilirsin:
  //  1) drive: "Google Drive dosya kimliği"  (dosya "Bağlantıya sahip herkes" olarak paylaşılmış olmalı)
  //  2) file : "dosya-adi.mp3"             (şarkıyı index.html ile AYNI klasöre koyarsan önce o çalar, olmazsa Drive denenir)
  TRACKS: [
    { title: "Azıcık ucundan", file: "azicikucundan.mp3" },
    { title: "Bar bar", file: "bar-bar.mp3" },
    { title: "Beddua helallik", file: "bedduahelallik.mp3" },
    { title: "Bestie", file: "bestie.mp3" },
    { title: "Bestie deep", file: "bestiedeep.mp3" },
    { title: "Bilsen", file: "bilsen.mp3" },
    { title: "Çuvaldız", file: "cuvaldiz.mp3" },
    { title: "Düngitti", file: "dungitti.mp3" },
    { title: "Elif", file: "elif.mp3" },
    { title: "Fısıltı", file: "fisilti.mp3" },
    { title: "İkimize", file: "ikimize.mp3" },
    { title: "İki sorunlu", file: "ikisorunlu.mp3" },
    { title: "İste böyle", file: "isteboyle.mp3" },
    { title: "İstirahat", file: "istirahat.mp3" },
    { title: "İstirahat (extended)", file: "istirahatextended.mp3" },
    { title: "Kazulet", file: "kazulet.mp3" },
    { title: "KRL", file: "krl.mp3" },
    { title: "Lobo", file: "lobo.m4a" },
    { title: "Mesein", file: "mesein.mp3" },
    { title: "Metus", file: "metus.mp3" },
    { title: "Mışılmışıl", file: "misilmisil.mp3" },
    { title: "Naar", file: "naar.mp3" },
    { title: "Ne anladın", file: "neanladın.mp3" },
    { title: "Nefes nefes", file: "nefesnefes.mp3" },
    { title: "Nefsim doyumsuz", file: "nefsim-doyumsuz.mp3" },
    { title: "Para ve pul", file: "paravepul.mp3" },
    { title: "Rabbi yesir", file: "RabbiYesir.mp3" },
    { title: "Sen gibi", file: "sengibi.mp3" },
    { title: "Sevgili", file: "sevgili.mp3" },
    { title: "Talan", file: "talann.mp3" },
    { title: "Toksik toksik", file: "toksiktoksik.mp3" },
    { title: "What is real", file: "whatisreal.wav" },
    { title: "Yaz geldi", file: "yazgeldi.mp3" }
  ],
  ARTIST: "MyByYavRu"
};
/* ================================================== */

const $ = id => document.getElementById(id);
const A = $('audio'), B = new Audio();
B.preload = 'auto'; B.setAttribute('playsinline','');
let audio = A;                                   // şu an çalan eleman (geçiş sırasında A <-> B değişir)
const bind = (ev, fn) => [A,B].forEach(el => el.addEventListener(ev, e => { if (el === audio) fn(e); }));
const tracks = CONFIG.TRACKS;
let idx = 0, shuffle = false, wantPlay = false, srcTry = 0, failStreak = 0;
const failed = new Set();

function sources(t){
  const l = [];
  if (t.file){                                         // önce sitedeki dosya (boşluk / Türkçe karakter varyantlarıyla)
    const v = new Set();
    const names = [t.file, t.file.replace(/\s+(\.[a-z0-9]+)$/i,'$1')];
    const mp3s = names.filter(n=>/\.wav$/i.test(n)).map(n=>n.replace(/\.wav$/i,'.mp3'));   // wav için önce aynı adlı mp3'ü dene
    const base = [...mp3s, ...names];
    const fold = x => x.replace(/ı/g,'i').replace(/İ/g,'I').replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ü/g,'u').replace(/Ü/g,'U').replace(/ö/g,'o').replace(/Ö/g,'O').replace(/ç/g,'c').replace(/Ç/g,'C');
    [...base, ...base.map(x=>x.toLowerCase()), ...base.map(fold), ...base.map(x=>fold(x).toLowerCase())].forEach(f=>{ v.add(f.normalize('NFC')); v.add(f.normalize('NFD')); });
    v.forEach(f=>l.push(encodeURI(f)));
  }
  if (t.drive){                                        // bulunamazsa Drive yedeği
    l.push(`https://drive.usercontent.google.com/download?id=${t.drive}&export=download`);
    l.push(`https://drive.google.com/uc?export=download&id=${t.drive}`);
  }
  return l;
}
const fmt = s => (!isFinite(s)||s<0) ? '0:00' : Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const setFill = el => el.style.setProperty('--p', (el.value/el.max*100)+'%');


/* ---- Bars ---- */
const barsEl = $('bars');
for (let i=0;i<20;i++) barsEl.appendChild(document.createElement('span'));
setInterval(()=>{
  const playing = !audio.paused;
  barsEl.childNodes.forEach(b => b.style.height = (playing ? 4+Math.random()*22 : 4) + 'px');
}, 110);

/* ---- Yükle / Çal ---- */
function load(i){
  idx = (i + tracks.length) % tracks.length;
  srcTry = 0;
  audio.src = sources(tracks[idx])[0];
  showMeta();
}
function play(){
  wantPlay = true;
  const p = audio.play();
  if (p && p.catch) p.catch(()=>{});
}
function pause(){ wantPlay = false; audio.pause(); }
function skip(dir){ load(nextIndex(dir)); if (wantPlay) play(); }

/* ---- Olaylar ---- */
bind('play', ()=>ui(true));
bind('pause', ()=>ui(false));
function ui(on){
  $('player').classList.toggle('playing', on);
  $('vinyl').classList.toggle('spin', on);
  $('ico').innerHTML = on ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('dot').classList.toggle('off', !on);
  $('liveTxt').textContent = on ? 'CANLI' : 'DURAKLATILDI';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
}
bind('playing', ()=>{ failStreak = 0; $('sub').textContent = CONFIG.ARTIST + ' · RadyoAI'; });
bind('waiting', ()=>{ $('sub').textContent = 'Yükleniyor…'; });
bind('loadedmetadata', ()=>{ $('dur').textContent = fmt(audio.duration); });
bind('timeupdate', ()=>{
  if (seeking) return;
  $('cur').textContent = fmt(audio.currentTime);
  if (audio.duration){ $('seek').value = audio.currentTime/audio.duration*1000; setFill($('seek')); }
});
bind('ended', ()=>skip(1));
bind('error', ()=>{
  const list = sources(tracks[idx]);
  if (srcTry < list.length-1){            // yedek adresi dene
    srcTry++;
    audio.src = list[srcTry];
    if (wantPlay) play();
    return;
  }
  // iki adres de çalışmadı: işaretle, sıradakine geç
  failed.add(idx);
  failStreak++;
  if (failStreak >= tracks.length){ wantPlay = false; $('sub').textContent = 'Hiçbir şarkı açılamadı. Paylaşım ayarlarını kontrol et.'; return; }
  $('sub').textContent = 'Bu şarkı açılamadı, sıradakine geçiliyor…';
  skip(1);
});

let seeking = false;
const seekEl = $('seek');
seekEl.addEventListener('input', ()=>{ seeking = true; setFill(seekEl); $('cur').textContent = fmt(seekEl.value/1000*(audio.duration||0)); });
seekEl.addEventListener('change', ()=>{ if (audio.duration) audio.currentTime = seekEl.value/1000*audio.duration; seeking = false; });

$('toggle').onclick = ()=> audio.paused ? play() : pause();
const volEl = $('vol');
volEl.addEventListener('input', ()=>{ const v = volEl.value/100; try { A.volume = v; B.volume = v; } catch(e){} setFill(volEl); });
setFill(volEl);

document.addEventListener('keydown', e=>{
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); audio.paused ? play() : pause(); }
});

if ('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play', play);
  navigator.mediaSession.setActionHandler('pause', pause);
}

/* ---- Armağan: çalan şarkının adı yerine sohbetten birinin adı ---- */
let DED = '', _users = null;
function getUsers(){
  if (_users) return _users;
  const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pk=a=>a[r(0,a.length-1)];
  const first=["Ahmet","Mehmet","Ayşe","Fatma","Emre","Burak","Elif","Zeynep","Can","Cem","Deniz","Ece","Eren","Gizem","Hakan","İrem","Kaan","Melis","Mert","Nazlı","Onur","Özge","Selin","Serkan","Tuğba","Uğur","Yasemin","Yusuf","Berk","Defne","Ege","Furkan","Gökhan","Hande","Kerem","Lale","Murat","Nehir","Oğuz","Pelin","Rüya","Sinan","Tolga","Utku","Volkan","Yağmur","Zafer","Barış","Ceren","Doruk"];
  const tails=["","_","34","06","35","61","tr","_official","x","music","_dj","1907","_beat","07","99"];
  const set=new Set();
  while(set.size<220){
    const base=pk(first).toLowerCase().replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/i̇/g,"i");
    set.add(base+pk(tails)+(Math.random()<.4?r(1,99):""));
  }
  return (_users=[...set]);
}

function startXfade(){
  if (!WA || xfading) return;
  const old = audio, prevIdx = idx;
  const rem = Math.max(0, audio.duration - audio.currentTime), len = Math.max(1, Math.min(XF, rem));
  const nxt = nextIndex(1);
  pendingSeek = 0;
  const nw = old === A ? B : A, vmax = volEl.value/100;
  xfading = true; xfIdx = prevIdx;
  nw.volume = 0; nw.src = sources(tracks[nxt])[0];
  idx = nxt; srcTry = 0; audio = nw; showMeta();
  const pr = nw.play(); if (pr && pr.catch) pr.catch(()=>{});
  const t0 = performance.now();
  const iv = setInterval(()=>{
    const k = Math.min(1, (performance.now() - t0)/(len*1000)), x = k*Math.PI/2;
    try { old.volume = Math.cos(x)*vmax; nw.volume = Math.sin(x)*vmax; } catch(e){}
    if (k >= 1){
      clearInterval(iv);
      try { old.pause(); old.removeAttribute('src'); old.load(); old.volume = vmax; nw.volume = vmax; } catch(e){}
      xfading = false; xfIdx = -1;
    }
  }, 50);
}

  const botSay=(u,text)=>{ add(u,text,'',colors[u.length%colors.length]); recent.push(u); if(recent.length>12)recent.shift(); };
  function flurry(n,pool){ for(let k=0;k<n;k++) setTimeout(()=>botSay(pick(users),nr(pool||shorts,'fl',6)),rnd(900,5500)); }

  /* ---- çalan şarkı duyurusu ---- */
  const dedT=["Bu şarkı @{u} için armağan edildi 🎁 Adını merak edersen bana sor!","@{u} için özel bir armağan: şu an çalan şarkı onun! 🎁","Bu parça @{u} armağanıdır 🎁 Şarkının adını öğrenmek isteyen bana yazsın 💬","Sırada @{u} için armağan bir şarkı var 🎶 Adını sorarsanız söylerim","@{u} bu şarkı senin için, keyfini çıkar! 🎁 Diğerleri adını bana sorabilir 😉","Armağan zamanı! 🎁 Bu şarkı @{u} için çalıyor, adı gizli, sormayı unutmayın 😄"];
  const dedThanks=["Vay be, bu şarkı benim için mi? Çok teşekkürler DJ 🥹","DJ YavRu bu armağan için sağ ol, çok mutlu oldum ❤️","Bu şarkı benim için mi?! Gözlerim doldu 😭","Teşekkürler DJ abi, günümü güzelleştirdin 🙏","Armağana bak ya, çok sağ ol DJ YavRu 🎁","Ben mi? Gerçekten mi? Teşekkürler ❤️","Şaşırdım valla, çok teşekkürler DJ 🥹","İyi ki yazmışım bugün, armağan bana çıktı 😄","Bu şarkı artık benim şarkım 😍 Teşekkürler DJ!"];
  const dedReply=["Güle güle dinle @{u}! 🎁","@{u} hak ettin, keyfini çıkar ❤️","Rica ederim @{u}, bu şarkı senin! 🎶","@{u} sevindiysen ben de sevindim 🥹","Ne demek @{u}, sırayla hepiniz armağan alacaksınız 😉"];
  let lastAnn=-1;
  bind('playing',()=>{
    if(lastAnn!==idx){
      lastAnn=idx; const u=DED;
      dj(fill(nr(dedT,'ded',3),{u}),600);
      if(Math.random()<.8) setTimeout(()=>{ botSay(u,nr(dedThanks,'dth',4)); dj(fill(nr(dedReply,'drep',3),{u}),rnd(1500,3500)); },rnd(3500,7000));
    }
  });

  /* ---- akan sohbet ---- */
  let locMode=false, placed=[];
  (function tick(){
    const u=pick(users);
    let txt, meta={};
    if(locMode){ const pm=placeMsg(); txt=pm.text; placed.push(pm.place); if(Math.random()<.07) dj(pm.place+" selamlar, hoş geldiniz! 👋",rnd(1200,2800)); }
    else { meta=botText(); txt=meta.text; }
    botSay(u,txt);
    if(!locMode){
      if(meta.toDJ && Math.random()<.92) dj(reply(txt,u),rnd(1500,4200));          // DJ'e hitap edilene bizzat cevap + teşekkür
      else if(meta.q && Math.random()<.5) dj(reply(txt,u),rnd(2000,5000));
    }
    setTimeout(tick, locMode ? rnd(350,900) : rnd(500,2000));
  })();
  for(let k=0;k<6;k++) botSay(pick(users),nr(react,'react',30));

  /* ---- DJ kendiliğinden konuşur ---- */
  const hour=()=>new Date().getHours();
  const greetTime=()=>{ const h=hour(); return h<6?"Gece kuşları, hoş geldiniz 🌙":h<12?"Günaydın herkese ☀️":h<18?"İyi günler herkese 👋":"İyi akşamlar herkese 🌆"; };
  const djPool=[
    "Bugün chat çok güzel, hepinize teşekkürler ❤️","Nasılsınız? Neler yapıyorsunuz? Yazın bakalım 😄","Kim kulaklıkla dinliyor? Elini kaldırsın 🎧","Yeni gelenlere hoş geldin, kendinizi evinizde hissedin 🙌","Sorularınızı okuyorum, hepsine cevap vermeye çalışıyorum 👀","Bu radyo sizin sayenizde büyüyor, her mesajınız değerli","Arkadaşlarınıza da gönderin, birlikte dinleyelim 🔊","Şarkıların hepsi orijinal, beni "+CONFIG.ARTIST+" adıyla bulabilirsiniz 🎶","Uyku yok mu bugün? 🌙 Ben buradayım","Chat'e yazan herkese teşekkürler, hepinizi okuyorum","Mix geçişlerini beğendiniz mi? Yorumlarınız önemli","Bir soru: en sevdiğiniz tarz hangisi? Afro house mu, slow mu, pop mu?","Bu şarkıyı yaparken çok emek verdim, sizin de sevmeniz harika 🥹","Radyo mantığı: hepimiz aynı şarkıyı aynı anda dinliyoruz, bu çok güzel bir his","Birazdan sürprizler var, kalın 😉","Hava nasıl sizin orada? Yazın bakalım ☁️","Şimdi herkes bir emoji bıraksın, kimler buradaymış görelim 🎧","Su içmeyi unutmayın, uzun yayın bu 💧","Tempo biraz yükseliyor, hazırlanın 🔥","Chat bugün efsane, teşekkürler hepinize 🙏",
    "Kim hangi saatte dinliyor? Gece mi gündüz mü? ☀️🌙","Bu akşam ne yaptınız? Anlatın bakalım","Bir dilek tutun, şarkı bitene kadar kimseye söylemeyin ✨","Her mesajı okuyorum, sağ olun, iyi ki varsınız"
  ];
  const shout=["@{u} hoş geldin, dinlediğin için teşekkürler! 🙏","@{u} yazdıkların için teşekkürler ❤️","Selam @{u}, nasılsın?","@{u} sen buradan hiç ayrılmıyorsun, teşekkürler 😄","@{u} mesajını gördüm, çok sağ ol! 🔥","@{u} bu akşam yayına güç verdin, teşekkürler ✨","@{u} hoş geldin, kulaklık tam mı? 🎧","Teşekkürler @{u}, böyle dinleyiciler olunca yayın güzel oluyor 🙌"];
  (function djLoop(){
    setTimeout(()=>{
      const r=Math.random();
      if(r<.45 && recent.length) add('DJ YavRu','🎧 '+fill(nr(shout,'sh2',4),{u:pick(recent)}),'dj');
      else if(r<.55) add('DJ YavRu','🎧 '+greetTime(),'dj');
      else add('DJ YavRu','🎧 '+nr(djPool,'djp',10),'dj');
      if(Math.random()<.55) flurry(rnd(2,5),react);
      djLoop();
    },rnd(16000,30000));
  })();

  /* ---- "Herkes dinlediği yeri yazsın" anı: sohbet şehir ve ülkelerle dolar ---- */
  const locCalls=["Herkes dinlediği yeri yazsın! 🌍 Şehrini ve ülkeni yaz, hepinizi okuyacağım","Hadi bakalım, herkes dinlediği yeri yazsın! 📍 Nereden katılıyorsunuz?","Herkes dinlediği yeri yazsın, merak ediyorum nerelerdeyiz! 🌎","Şimdi herkes dinlediği yeri yazsın, şehir de olur ülke de! 🗺️"];
  function startLoc(){
    if(!locMode){
      add('DJ YavRu','🎧 '+nr(locCalls,'loc',3),'dj');
      setTimeout(()=>{ locMode=true; placed=[]; },rnd(1200,2200));
      setTimeout(()=>{ if(locMode && placed.length){ const u=[...new Set(placed)]; dj("Vay be! "+u.slice(0,3).join(", ")+"… hepsini görüyorum, süpersiniz! 🌍🔥"); } },22000);
      setTimeout(()=>{
        const u=[...new Set(placed)]; locMode=false;
        dj("Teşekkürler hepinize! "+u.length+" farklı yerden mesaj geldi: "+u.slice(0,4).join(", ")+" ve daha fazlası. Nerelerden dinlendiğimizi görmek harika 🌍❤️");
      },46000);
    }
    setTimeout(startLoc, rnd(420000,600000));
  }
  setTimeout(startLoc, 100000);

  /* ---- dinleyiciler çalan şarkıyı sorar ---- */
  const askQ=["Çalan şarkı ne?","Bu şarkının adı ne?","Şu an ne çalıyor?","Bu parça kimin?","Şarkı adını yazar mısın?","Bu şarkı çok güzel, adı neydi?","Az önce başlayan şarkı hangisi?"];
  (function ask(){
    setTimeout(()=>{
      if(!locMode){
        const u=pick(users); const q=nr(askQ,'ask',4);
        botSay(u,q); dj(reply(q,u),rnd(2000,4500));
      }
      ask();
    },rnd(18000,34000));
  })();

  /* ---- kullanıcı mesajı ---- */
  $('cf').addEventListener('submit',e=>{
    e.preventDefault();
    const i=$('ci'),t=i.value.trim();
    if(!t)return;
    add('Sen',t,'me');
    i.value='';
    dj(reply(t,'Sen'),rnd(1200,3000));
  });

  /* ---- izleyici sayacı 2400–5000, aktif yazan sayısı, her +100'de duyuru ---- */
  let v=rnd(2800,4200), top=Math.floor(v/100)*100, tgt=3700;
  const fmt=n=>n.toLocaleString('tr-TR');
  const hype=["📈 Dinleyici sayısı {x} oldu! Hoş geldiniz herkese 🙌","🎉 Şu an {x} kişi birlikte dinliyoruz!","🔥 {x} dinleyiciyiz, yayın büyüyor!","👥 Aktif dinleyici sayısı {x} oldu, hepinize teşekkürler ❤️","🚀 {x} kişi aynı anda dinliyor, inanılmaz!"];
  function upd(){
    tgt=Math.max(2600,Math.min(4800,tgt+rnd(-25,25)));
    v+=rnd(-40,40)+Math.round((tgt-v)*0.03);
    if(v<2400)v=2400+rnd(0,60);
    if(v>5000)v=5000-rnd(0,60);
    $('n').textContent='· 👁 '+fmt(v);
    $('actN').textContent=fmt(Math.max(40,Math.round(v*0.055+rnd(-10,10))));
    const lvl=Math.floor(v/100)*100;
    if(lvl>=top+100){ top=lvl; add('DJ YavRu','🎧 '+fill(nr(hype,'hype',3),{x:fmt(lvl)}),'dj'); flurry(rnd(2,4),shorts); }
    else if(lvl<=top-300){ top=lvl; }     // sayı düştüyse yeniden artışta tekrar duyur
  }
  upd(); setInterval(upd,2000);
})();
</script>
</body>
</html>
